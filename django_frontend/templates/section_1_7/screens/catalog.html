<div class="filter-bar catalog-filters">
  <label class="filter-search"><span aria-hidden="true">⌕</span><input type="search" placeholder="Search by product name or SKU" /></label>
  <select aria-label="Product category"><option>All categories</option></select>
  <select aria-label="Product size"><option>All sizes</option></select>
  <button class="outline-button" type="button">In stock only</button>
</div>
<div class="catalog-layout">
  <section class="catalog-products surface-panel">
    <h2>Featured apparel &amp; accessories</h2>
    <p>Product listings will appear when catalog data is available.</p>
    <p>No product images or sample inventory are included in this prototype.</p>
  </section>
  <aside class="surface-panel cart-panel">
    <div class="panel-heading"><div><h2>Current order</h2><p>Start an order by selecting an available item.</p></div><span class="status-badge">Draft</span></div>
    <p>No items in this order.</p>
    <div class="total-row"><span>Total due</span><strong>—</strong></div>
    <a class="solid-button button-link full-button" href="{% url 'main:screen' '3.1-checkout-pending-payment' %}">Proceed to checkout</a>
  </aside>
</div>
