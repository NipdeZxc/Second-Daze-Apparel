{% if metric_labels %}
  <section class="stat-grid" aria-label="Performance metrics">
    {% for label in metric_labels %}
      <article class="stat-card">
        <div class="stat-topline"><span>{{ label }}</span><span class="stat-icon" aria-hidden="true">◷</span></div>
        <strong>—</strong>
        <p>Available when connected to live data</p>
      </article>
    {% endfor %}
  </section>
{% endif %}
