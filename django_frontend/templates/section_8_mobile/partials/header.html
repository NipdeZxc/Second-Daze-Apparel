{% load static %}
<header class="mobile-header">

    <img class="app-brand-logo" src="{% static 'brand-logo.jpg' %}" alt="" />
  </a>
  <strong>Second Daze</strong>
  <a class="outline-button button-link mobile-directory-link" href="{% url 'main:directory' %}">All screens</a>

    <span class="mobile-avatar">SD</span>
  {% endif %}
</header>
